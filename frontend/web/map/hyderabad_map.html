<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Smart Travel City Discovery Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .leaflet-container { background: #050912; }
    .leaflet-control-attribution { background: rgba(3, 8, 15, .82) !important; color: #aab5c5 !important; font-size: 9px !important; }
    .leaflet-control-attribution a { color: #00d9ff !important; }
    .leaflet-control-container { display: none; }
    .hotel-div-icon { background: transparent; border: 0; }
    .hotel-marker { display: flex; align-items: center; width: 190px; height: 60px; transform: translate(-28px, -50%); cursor: pointer; }
    .hotel-photo-wrap { position: relative; flex: 0 0 56px; width: 56px; height: 56px; z-index: 2; }
    .hotel-photo { display: block; width: 56px; height: 56px; object-fit: cover; border: 3px solid #00d9ff; border-radius: 50%; background: #101827; box-shadow: 0 0 8px #00d9ff, 0 0 20px rgba(0,217,255,.48); }
    .hotel-pin-dot { position: absolute; left: 22px; bottom: -8px; width: 12px; height: 12px; border: 2px solid #b9f7ff; border-radius: 50%; background: #00d9ff; box-shadow: 0 0 12px #00d9ff; }
    .hotel-info { width: 128px; margin-left: 5px; padding: 6px 7px; overflow: hidden; border: 1px solid rgba(0,217,255,.4); border-radius: 9px; background: rgba(3,10,20,.94); box-shadow: 0 4px 16px rgba(0,0,0,.55); color: #fff; line-height: 1.2; }
    .hotel-name { overflow: hidden; color: #fff; font-size: 11px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .hotel-meta { margin-top: 3px; color: #aab5c5; font-size: 9px; white-space: nowrap; }
    .hotel-price { margin-top: 3px; color: #00d9ff; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .hotel-marker:hover { z-index: 1000 !important; transform: translate(-28px, -50%) scale(1.05); }
    .route-line-glow { filter: drop-shadow(0 0 5px rgba(0,217,255,.75)); }
    .route-plane { color: #6feaff; font-size: 19px; text-shadow: 0 0 8px #00d9ff, 0 0 16px #00d9ff; }
    .map-controls { position: absolute; z-index: 1000; right: 20px; bottom: 22px; display: flex; flex-direction: column; gap: 7px; }
    .map-control { width: 42px; height: 42px; border: 1px solid rgba(0,217,255,.65); border-radius: 11px; background: rgba(4,12,23,.94); color: #00d9ff; font-size: 21px; font-weight: 700; cursor: pointer; box-shadow: 0 0 12px rgba(0,217,255,.2); }
    .map-control:hover { background: rgba(0,139,255,.25); }
    @media (max-width: 700px) { .hotel-marker { transform: translate(-28px, -50%) scale(.86); transform-origin: left center; } .map-controls { right: 12px; bottom: 14px; } }
  </style>
</head>
<body>
  <div id="map" aria-label="Hotel discovery map"></div>
  <div class="map-controls">
    <button class="map-control" aria-label="Zoom in" onclick="map.zoomIn()">+</button>
    <button class="map-control" aria-label="Zoom out" onclick="userMapZoom = true; map.zoomOut()">−</button>
    <button class="map-control" aria-label="Recenter destination" onclick="recenter()">◎</button>
  </div>
  <script>
    const map = L.map('map', { zoomControl: false, attributionControl: true, zoomSnap: 0.25, worldCopyJump: true }).setView([20, 20], 2);
    L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'
    }).addTo(map);
    L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Labels &copy; Esri'
    }).addTo(map);

    let center = [20, 20];
    let destinationName = '';
    let hotels = [];
    let hotelMarkers = [];
    let routeLayers = [];
    let planeMarker = null;
    let activeHotelId = null;
    let planeTimer = null;
    let globeReturnSent = false;
    let userMapZoom = false;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    function priceLabel(hotel) {
      if (!Number.isFinite(Number(hotel.starting_price)) || Number(hotel.starting_price) <= 0) return 'Price unavailable';
      try { return `${new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(Number(hotel.starting_price || 0))} / night`; }
      catch (_) { return `${Number(hotel.starting_price || 0).toFixed(0)} / night`; }
    }

    function hotelIcon(hotel) {
      const imageUrl = /^https?:\/\//i.test(hotel.exterior_image_url || '') ? hotel.exterior_image_url : '';
      const photo = imageUrl
        ? `<img class="hotel-photo" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(hotel.hotel_name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`
        : '';
      return L.divIcon({
        className: 'hotel-div-icon',
        iconSize: [190, 60],
        iconAnchor: [28, 30],
        html: `<div class="hotel-marker" role="button" tabindex="0" onkeydown="if(event.key==='Enter')selectHotel(${Number(hotel.hotel_id)})" title="Open ${escapeHtml(hotel.hotel_name)}"><div class="hotel-photo-wrap">${photo}<div class="hotel-photo" style="${photo ? 'display:none;' : 'display:grid;place-items:center;color:#00d9ff;font-size:25px;'}">⌂</div><span class="hotel-pin-dot"></span></div><div class="hotel-info"><div class="hotel-name">${escapeHtml(hotel.hotel_name)}</div><div class="hotel-meta">${Number(hotel.star_rating) > 0 ? `★ ${Number(hotel.star_rating).toFixed(1)}` : 'Rating unavailable'} · ${Number(hotel.review_count || 0).toLocaleString()} reviews</div><div class="hotel-price">${escapeHtml(priceLabel(hotel))}</div></div></div>`
      });
    }

    function curvedPoints(from, to, bend = 0.16) {
      const midLat = (from[0] + to[0]) / 2;
      const cosLat = Math.max(0.25, Math.cos(midLat * Math.PI / 180));
      const dx = (to[1] - from[1]) * cosLat;
      const dy = to[0] - from[0];
      const distance = Math.hypot(dx, dy);
      if (distance < 0.00001) return [from, to];
      const controlLat = midLat + (-dx / distance) * distance * bend;
      const controlLng = (from[1] + to[1]) / 2 + (dy / distance) * distance * bend / cosLat;
      const points = [];
      for (let i = 0; i <= 24; i++) {
        const t = i / 24, u = 1 - t;
        points.push([
          u * u * from[0] + 2 * u * t * controlLat + t * t * to[0],
          u * u * from[1] + 2 * u * t * controlLng + t * t * to[1]
        ]);
      }
      return points;
    }

    function clearLayers() {
      hotelMarkers.forEach(layer => map.removeLayer(layer));
      routeLayers.forEach(layer => map.removeLayer(layer));
      if (planeMarker) map.removeLayer(planeMarker);
      if (planeTimer) clearInterval(planeTimer);
      hotelMarkers = [];
      routeLayers = [];
      planeMarker = null;
      planeTimer = null;
    }

    function renderHotels() {
      clearLayers();
      const located = hotels.filter(h => Number.isFinite(Number(h.latitude)) && Number.isFinite(Number(h.longitude)) && Number(h.hotel_id));
      const points = located.map(h => [Number(h.latitude), Number(h.longitude)]);
      if (points.length > 1) {
        const routePoints = [];
        points.forEach((point, index) => {
          const next = points[(index + 1) % points.length];
          const curve = curvedPoints(point, next, index % 2 ? -0.12 : 0.12);
          routeLayers.push(L.polyline(curve, { color: '#00d9ff', weight: 7, opacity: .18, className: 'route-line-glow', interactive: false }).addTo(map));
          routeLayers.push(L.polyline(curve, { color: '#22dfff', weight: 2, opacity: .78, dashArray: '5 9', lineCap: 'round', interactive: false }).addTo(map));
          if (index === 0) routePoints.push(...curve);
        });
        const planeIcon = L.divIcon({ className: 'route-plane', html: '✈', iconSize: [24, 24], iconAnchor: [12, 12] });
        planeMarker = L.marker(routePoints[0], { icon: planeIcon, interactive: false, zIndexOffset: 350 }).addTo(map);
        let step = 0;
        planeTimer = setInterval(() => {
          if (routePoints.length) {
            planeMarker.setLatLng(routePoints[step % routePoints.length]);
            step += 1;
          }
        }, 70);
      }

      located.forEach(hotel => {
        const marker = L.marker([Number(hotel.latitude), Number(hotel.longitude)], {
          icon: hotelIcon(hotel),
          keyboard: true,
          zIndexOffset: 500
        }).addTo(map);
        marker.on('click', () => selectHotel(hotel.hotel_id));
        marker.hotelData = hotel;
        hotelMarkers.push(marker);
      });
      if (points.length > 1) {
        map.fitBounds(L.latLngBounds(points), { paddingTopLeft: [90, 70], paddingBottomRight: [210, 70], maxZoom: 12.75, animate: true });
      }
    }

    function selectHotel(hotelId) {
      activeHotelId = Number(hotelId);
      const hotel = hotels.find(item => Number(item.hotel_id) === activeHotelId);
      if (hotel) map.flyTo([Number(hotel.latitude), Number(hotel.longitude)], Math.max(map.getZoom(), 14), { duration: 0.7 });
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ type: 'HOTEL_CLICKED', hotelId: activeHotelId, hotelName: hotel?.hotel_name }), '*');
      }
    }

    function recenter() {
      map.flyTo(center, destinationName ? 13 : 2, { duration: 0.8 });
    }

    window.addEventListener('resize', () => map.invalidateSize());
    map.on('wheel', () => { userMapZoom = true; });
    map.on('touchstart', () => { userMapZoom = true; });
    map.on('zoomend', () => {
      if (userMapZoom && destinationName && map.getZoom() <= 8.5 && !globeReturnSent) {
        globeReturnSent = true;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(JSON.stringify({
            type: 'RETURN_TO_GLOBE', latitude: center[0], longitude: center[1]
          }), '*');
        }
      }
    });
    window.addEventListener('message', event => {
      let data = event.data;
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch (_) { return; } }
      if (!data || typeof data !== 'object') return;

      if (data.type === 'SET_DESTINATION') {
        center = [Number(data.latitude), Number(data.longitude)];
        destinationName = String(data.name || 'Destination');
        globeReturnSent = false;
        userMapZoom = false;
        globeReturnSent = false;
        if (Number.isFinite(center[0]) && Number.isFinite(center[1])) {
          map.flyTo(center, 13, { animate: true, duration: 1.5 });
          setTimeout(() => map.invalidateSize(), 350);
        }
      } else if (data.type === 'SET_HOTELS') {
        hotels = Array.isArray(data.hotels) ? data.hotels : [];
        renderHotels();
      } else if (data.type === 'FOCUS_HOTEL') {
        const marker = hotelMarkers.find(item => Number(item.hotelData.hotel_id) === Number(data.hotelId));
        if (marker) map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 14), { duration: 0.7 });
      } else if (data.type === 'RECENTER') {
        recenter();
      } else if (data.type === 'CLEAR_HOTELS') {
        hotels = [];
        activeHotelId = null;
        clearLayers();
      } else if (data.type === 'SET_BLUR') {
        document.getElementById('map').style.filter = data.blurred ? 'blur(8px)' : 'none';
      }
    });

    setTimeout(() => {
      if (window.parent) window.parent.postMessage(JSON.stringify({ type: 'MAP_READY' }), '*');
    }, 350);
  </script>
</body>
</html>
