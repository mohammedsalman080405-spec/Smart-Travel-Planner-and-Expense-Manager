<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realistic 3D Earth Globe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #globe-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #globe-canvas:active {
      cursor: grabbing;
    }

    /* Floating Hotel Tooltip on Globe */
    #hotel-tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 1000;
      background: rgba(13, 23, 46, 0.94);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #00D2FF;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 210, 255, 0.3);
      font-size: 12px;
      transform: translate(-50%, -120%);
      transition: opacity 0.15s ease;
      white-space: nowrap;
    }
    #hotel-tooltip .hotel-title {
      font-weight: 700;
      font-size: 13px;
      color: #ffffff;
      margin-bottom: 2px;
    }
    #hotel-tooltip .hotel-sub {
      color: #00D2FF;
      font-weight: 600;
      font-size: 11px;
    }

    /* Loading overlay */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.6s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 210, 255, 0.2);
      border-top-color: #00D2FF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      color: #94A3B8;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Rendering NASA Blue Marble Earth...</div>
  </div>

  <div id="hotel-tooltip">
    <div class="hotel-title" id="tooltip-title">Hotel Name</div>
    <div class="hotel-sub" id="tooltip-sub">$240/night • ★ 4.8</div>
  </div>

  <div id="globe-container" style="width: 100%; height: 100%;"></div>

  <!-- Local Three.js & OrbitControls -->
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="earth_globe.js"></script>
</body>
</html>
